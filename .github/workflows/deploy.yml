name: Deploy to MonsterASP.NET

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore KysKys.csproj

      - name: Build
        run: dotnet build KysKys.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish KysKys.csproj -c Release --no-restore -o publish -r win-x86 --self-contained false

      - name: Deploy to MonsterASP.NET via Web Deploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
